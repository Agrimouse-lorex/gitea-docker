version: "3"

services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: no
    ports:
      - "3000:3000"

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - gitea
    environment:
      BASE_WEB_URL: http://gitea:3000
    volumes:
      - ./playwright-report:/app/playwright-report
    command: >
      sh -c "npx playwright install && npx playwright test"
    restart: no
